[package]
name = "keym"
version = "0.1.0"
description = "KeyM — macOS keyboard sounds and typing statistics"
authors = ["IMhao-123"]
license = "CC0-1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "keym_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "keym"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "=2.4.3"
rodio = "0.19"
cpal = "0.15.3"
hound = "3.5"
core-graphics = "0.24"
core-foundation = "0.10"
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4.45"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
dirs-next = "2.0.0"

[dev-dependencies]
chrono-tz = "0.10"
